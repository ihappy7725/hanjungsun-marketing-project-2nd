services:
  - type: web
    name: hanjeongseon
    runtime: python
    branch: main
    # 무료 인스턴스: 장시간 미사용 시 절전되며 로컬 파일은 영구 보존되지 않습니다.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app:create_app init-db && gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: U2NET_HOME
        value: /opt/render/project/src/instance/models
      - key: PUBLIC_BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: CALENDARIFIC_API_KEY
        sync: false
      - key: ECOS_API_KEY
        sync: false
      - key: DEEPL_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: PHYLLO_CLIENT_ID
        sync: false
      - key: PHYLLO_CLIENT_SECRET
        sync: false
      - key: PHYLLO_ENV
        value: production
      - key: MODASH_API_KEY
        sync: false
      - key: HYPEAUDITOR_CLIENT_ID
        sync: false
      - key: HYPEAUDITOR_API_TOKEN
        sync: false
      - key: HYPEAUDITOR_SANDBOX
        value: "0"
      - key: HF_API_KEY_ID
        sync: false
      - key: HF_API_KEY_SECRET
        sync: false
      - key: FIGMA_ACCESS_TOKEN
        sync: false
