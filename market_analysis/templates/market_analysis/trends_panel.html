<div class="ma-trends" data-trends-api="{{ url_for('market_analysis.trends_api', country_code='VN') }}">
<div class="trends-page">
  <div id="loading" class="notice" role="status">트렌드 데이터를 불러오는 중입니다.</div>
  <div id="error" class="notice error" role="alert" hidden>트렌드 데이터를 불러오지 못했습니다. 잠시 후 다시 확인해 주세요.</div>
  <div id="notices" class="trend-notices" aria-live="polite"></div>

  <div id="dashboard" class="dashboard trends-dashboard" hidden>
    <div id="category-picker" class="category-picker" role="group" aria-label="카테고리 선택"></div>

    <section class="two-column trend-panels">
      <article class="card" aria-labelledby="ranking-title">
        <div class="section-head">
          <div><h2 id="ranking-title">카테고리별 인기 메뉴 순위</h2></div>
        </div>
        <div id="ranking"></div>
      </article>

      <article class="card" aria-labelledby="category-trend-title">
        <div class="section-head">
          <div><h2 id="category-trend-title">카테고리 관심도</h2></div>
        </div>
        <div id="category-trend"></div>
      </article>
    </section>

    <section class="two-column trend-panels">
      <article class="card" aria-labelledby="fruit-title">
        <h2 id="fruit-title">베트남 과일 맛 검색 관심도</h2>
        <div id="fruit-flavors"></div>
      </article>
      <article class="card" aria-labelledby="region-title">
        <h2 id="region-title">베트남 지역별 관심도</h2>
        <div id="regions"></div>
      </article>
    </section>

    <section class="trend-panels">
      <article class="card" aria-labelledby="season-title">
        <h2 id="season-title">월별 검색 계절성</h2>
        <div id="seasonality"></div>
      </article>
    </section>

    <section class="trend-panels">
      <article class="card" aria-labelledby="ads-title">
        <div class="section-head">
          <div><h2 id="ads-title">광고 트렌드</h2></div>
        </div>
        <div id="ad-trends"></div>
      </article>
    </section>

    <p class="source" id="source-line"></p>
  </div>
</div></div>
