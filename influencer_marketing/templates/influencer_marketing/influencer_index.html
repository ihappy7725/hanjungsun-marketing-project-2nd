{% extends "platform_core/base.html" %}

{% block title %}인플루언서 마케팅{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('influencer_marketing.static', filename='css/influencer_main.css') }}">

<div class="influencer-page" id="imRoot">
  <header class="im-head">
    <div>
      <h1>인플루언서 마케팅</h1>
    </div>
  </header>

  <nav class="im-tabs" role="tablist" id="imTabs"></nav>
  <div id="imBanners"></div>
  <section id="imView" aria-live="polite"></section>

  <div class="im-scrim" id="imScrim" hidden></div>
  <aside class="im-drawer" id="imDrawer" hidden role="dialog" aria-modal="true" aria-labelledby="imDrawerTitle"></aside>
  <div class="im-toast" id="imToast" hidden role="status"></div>

  <noscript><p class="im-banner">이 화면은 JavaScript가 켜져 있어야 동작해요.</p></noscript>
</div>

<script id="imBoot" type="application/json">{{ boot|tojson }}</script>
<script type="module" src="{{ url_for('influencer_marketing.static', filename='js/influencer_main.js') }}"></script>
{% endblock %}
